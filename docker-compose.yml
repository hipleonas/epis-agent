version: "3.9"

services:

  gsai-agent-api:
    image: lilmeen/gsai-agent:latest
    container_name: gsai-agent-api

    env_file:
      - .env

    ports:
      - "6000:6000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s