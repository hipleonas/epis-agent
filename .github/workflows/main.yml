name: Docker CI/CD - epis-llm-agent

on:
  push:
    branches:
      - main
  workflow_dispatch: 

concurrency:
  group: deploy-epis-llm-agent
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version (short commit SHA)
        id: vars
        run: |
          echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/epis-llm-agent:${{ steps.vars.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/epis-llm-agent:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vast.ai VM via SSH
        uses: appleboy/ssh-action@v1.0.3   # cập nhật lên phiên bản mới hơn một chút (tùy chọn)
        with:
          host: ${{ secrets.VAST_HOST }}
          username: ${{ secrets.VAST_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VAST_PORT }}
          script: |
            set -e

            echo "=== Login Docker Hub ==="
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "=== Pull new image ==="
            docker pull ${{ secrets.DOCKER_USERNAME }}/epis-llm-agent:${{ needs.build.outputs.version }}

            echo "=== Stop and remove old container (if exists) ==="
            docker stop epis-llm-agent || true
            docker rm epis-llm-agent || true

            echo "=== Run new container with env-file === "
            docker run -d \
              --name epis-llm-agent \
              -p 6000:6000 \
              --restart always \
              --env-file <(echo "${{ secrets.ENV_FILE_CONTENT }}") \
              ${{ secrets.DOCKER_USERNAME }}/epis-llm-agent:${{ needs.build.outputs.version }}

            echo "=== Cleanup old images ==="
            docker image prune -f --filter "until=24h" || true

            echo "=== Deploy completed successfully ==="
            echo "Image tag: ${{ secrets.DOCKER_USERNAME }}/epis-llm-agent:${{ needs.build.outputs.version }}"
